<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do match — GiraMatch</title>
  <link rel="icon" type="image/png" href="logo-giramatch.png">
  <link rel="stylesheet" href="stylo.css">
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
GM.pagina('matches', 'Detalhes do match', async (main) => {
  const id = GM.param('id');
  if (!id) { main.innerHTML = GM.vazio('Match não informado', 'Escolha um match na lista.', '<a class="btn btn-primary" href="matches.html">Ver matches</a>'); return; }
  const esc = GM.esc;

  const CRIT = [
    ['similaridade', 'Similaridade do objeto', 45, 'Mesmo código de catálogo vale 100%; senão, comparamos os termos da descrição.'],
    ['tempo', 'Proximidade no PCA', 25, 'Diferença entre os meses previstos (zera em 6 meses).'],
    ['territorio', 'Território', 15, 'Mesmo município ou estado — pesa mais para serviços.'],
    ['sustentabilidade', 'Critérios sustentáveis', 15, 'Critérios em comum entre as duas demandas.'],
  ];

  const desenhar = async () => {
    const { match: m, aviso } = await GM.api('GET', `/api/matches/${id}`);
    const a = m.minha_demanda, b = m.outra_demanda, e = GM.estadoMatch(m);
    const linhas = [
      ['Órgão', esc(a.orgao.sigla), esc(b.orgao.sigla), false],
      ['Esfera', esc(a.orgao.esfera), esc(b.orgao.esfera), a.orgao.esfera === b.orgao.esfera],
      ['Descrição', esc(a.descricao), esc(b.descricao), a.descricao === b.descricao],
      ['Natureza', NAT[a.natureza], NAT[b.natureza], a.natureza === b.natureza],
      ['Código de catálogo', esc(a.codigo_catalogo || '—'), esc(b.codigo_catalogo || '—'), a.codigo_catalogo && a.codigo_catalogo === b.codigo_catalogo],
      ['Quantidade', GM.qtd(a), GM.qtd(b), false],
      ['Previsão no PCA', GM.mes(a), GM.mes(b), a.mes_previsto === b.mes_previsto && a.ano === b.ano],
      ['Valor estimado', GM.valorOuSigilo(a), GM.valorOuSigilo(b), false],
      ['Local', esc((a.municipio || a.orgao.municipio) + '/' + (a.uf || a.orgao.uf)), esc((b.municipio || b.orgao.municipio) + '/' + (b.uf || b.orgao.uf)), (a.municipio || a.orgao.municipio) === (b.municipio || b.orgao.municipio)],
      ['Fim do contrato atual', GM.data(a.fim_contrato_atual), GM.data(b.fim_contrato_atual), false],
      ['Critérios sustentáveis', (a.criterios_sustentaveis || []).map(esc).join(', ') || '—', (b.criterios_sustentaveis || []).map(esc).join(', ') || '—', false],
    ];
    const caminho = m.caminho || {};
    const botoes = e.chave === 'novo'
      ? `<button class="btn btn-primary" data-acao="conectar" data-id="${m.id}" type="button">Conectar com ${esc(b.orgao.sigla)}</button><button class="btn" data-acao="recusar" data-id="${m.id}" type="button">Agora não</button>`
      : e.chave === 'conectado' ? `<a class="btn btn-primary" href="comite.html?id=${m.comite_id}">Abrir comitê</a><a class="btn" href="acompanhamento.html?id=${m.comite_id}">Acompanhar</a>`
      : e.chave === 'aguardando' ? '<span class="muted small">Você já manifestou interesse. A resposta do outro órgão só é revelada quando os dois conectam.</span>' : '<span class="muted small">Você dispensou esta sugestão.</span>';

    main.innerHTML = `
      <p class="small"><a href="matches.html">← Voltar aos matches</a></p>
      <div class="card row" style="gap:20px;margin-bottom:16px">
        ${GM.anel(m.score, 'grande')}
        <div style="flex:1;min-width:220px"><span class="badge ${e.cls}">${e.rot}</span>
          <h2 style="font-size:1.35rem;margin:6px 0 2px">${esc(a.descricao)}</h2>
          <p class="muted" style="margin:0">${esc(a.orgao.sigla)} <strong>×</strong> ${esc(b.orgao.sigla)} — compatibilidade de <strong>${m.score}%</strong></p></div>
        <div class="row">${botoes}</div>
      </div>

      <div class="grid g-main">
        <div class="stack">
          <section class="card"><h2>Comparação das demandas</h2>
            <div class="compare" role="table">
              <div class="h"></div><div class="h">${esc(a.orgao.sigla)} (você)</div><div class="h">${esc(b.orgao.sigla)}</div>
              ${linhas.map(([k, x, y, ig]) => `<div class="k">${k}</div><div class="${ig ? 'igual' : ''}">${x}</div><div class="${ig ? 'igual' : ''}">${y}</div>`).join('')}
            </div>
            <p class="small muted" style="margin-top:8px">Campos em verde coincidem entre as duas demandas.</p></section>

          <section class="card"><h2>Por que é compatível?</h2>
            <ul class="ul-clean">${m.motivos.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
            <h3 style="margin:18px 0 10px">Nota por critério</h3>
            ${CRIT.map(([k, rot, peso, aj]) => { const n = Math.round((m.componentes[k] || 0) * 100); return `
              <div class="crit"><div class="topo"><span><strong>${rot}</strong> <span class="muted small">(peso ${peso}%)</span></span><strong>${n}%</strong></div>
                <div class="bar ${n >= 85 ? 'ok' : n < 50 ? 'acc' : ''}"><i style="width:${n}%"></i></div><span class="muted small">${aj}</span></div>`; }).join('')}
          </section>
        </div>

        <aside class="stack">
          <section class="card"><h2>Caminho sugerido</h2>
            <p><strong>${esc(caminho.titulo)}</strong></p><p class="small">${esc(caminho.descricao)}</p>
            <p class="small"><strong>Gerenciador:</strong> ${esc(caminho.gerenciador)}<br><strong>Participante(s):</strong> ${(caminho.participantes || []).map(esc).join(', ')}</p>
            <div class="lbl small">Fundamentos</div><ul class="small" style="margin:4px 0 0;padding-left:18px">${(caminho.fundamentos || []).map((x) => `<li>${esc(x)}</li>`).join('')}</ul></section>

          ${m.alertas.length ? `<section class="card"><h2>Pontos de atenção</h2>${m.alertas.map((x) => `<div class="alert a-warn"><span>⚠️</span><div>${esc(x.texto)}</div></div>`).join('')}</section>` : ''}

          <section class="card"><h2>Ganho estimado</h2>
            <div class="stat"><span class="n">${m.economia_valor != null ? GM.brl(m.economia_valor) : GM.pct(m.economia_pct)}</span>
              <span class="l">${m.economia_valor != null ? `economia (${GM.pct(m.economia_pct)}) em ${GM.num(m.volume_total || 0)} ${esc(a.unidade)} somados` : (b.valor_sigiloso ? 'Valor sigiloso: o ganho em reais não é calculado.' : 'ganho de escala estimado')}</span></div>
            <p class="small muted" style="margin-top:8px">Estimativa ilustrativa, a calibrar com dados reais.</p></section>

          <div class="alert a-info"><div>${esc(aviso)}</div></div>
        </aside>
      </div>`;
  };
  await desenhar();
  GM.ligarDecisoes(main, desenhar);
});
</script>
</body>
</html>
